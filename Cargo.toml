[package]
name = "win-keep-awake"
version = "2.3.3"
edition = "2021"
description = "防息屏/防锁定工具：现代 GUI + 系统托盘常驻；双模式（屏幕常亮注入保活 / 息屏防睡——到点关屏但系统不休眠），可配置定时自动停止与托盘一键重启"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow"] }
tray-icon = "0.26"
raw-window-handle = "0.6"

# 构建期：生成 .ico 并嵌入 exe 资源段（不影响运行时体积与独立 exe 约束）
[build-dependencies]
winresource = "0.1"
png = "0.17"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Power",
    "Win32_System_Shutdown",
    "Win32_System_SystemInformation",
] }

[[bin]]
name = "WinKeepAwake"
path = "src/main.rs"

# 独立 exe 交付：LTO + 单编译单元 + 裁剪符号，体积最小化
[profile.release]
lto = "thin"
opt-level = "s"
codegen-units = 1
strip = true
panic = "abort"
